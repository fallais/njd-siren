<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dub siren for reggae and sound-system culture, built with the Web Audio API." />

    <title>Siren</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">

    <link rel="icon" href="favicon.svg" />
  </head>

  <body>

    <div id="app" v-cloak>
      <div class="container">
        <div class="row mt-4">

          <!-- Modulation -->
          <div class="col-12 col-lg-8">
            <div class="card text-bg-dark mb-3">
              <div class="card-header">
                Modulation
              </div>
              <div class="card-body pt-2">
                <div class="row g-2">
                  <div class="col-12 col-md-6">
                    <div class="card bg-secondary-custom text-white h-100">
                      <div class="card-body">
                        <h5 class="card-title">Wave</h5>
                        <div class="form-check" v-for="w in ['sine', 'triangle', 'square', 'sawtooth']" :key="w">
                          <input type="radio" :id="'wave-' + w" name="wave" v-model="values.siren.waveForm" :value="w" class="form-check-input">
                          <label class="form-check-label text-capitalize" :for="'wave-' + w">{{ w }}</label>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="card bg-secondary-custom text-white h-100">
                      <div class="card-body">
                        <h5 class="card-title">Carrier</h5>
                        <div class="form-check" v-for="w in ['sine', 'triangle', 'square', 'sawtooth']" :key="w">
                          <input type="radio" :id="'carrier-' + w" name="carrier" v-model="values.siren.carrier" :value="w" class="form-check-input">
                          <label class="form-check-label text-capitalize" :for="'carrier-' + w">{{ w }}</label>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="card bg-secondary-custom text-white h-100">
                      <div class="card-body">
                        <label class="h5 card-title" for="tone">Tone <small>({{ values.siren.tone }})</small></label>
                        <input id="tone" class="form-range" v-model.number="values.siren.tone" max="1400" min="40" step="10" type="range">
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="card bg-secondary-custom text-white h-100">
                      <div class="card-body">
                        <label class="h5 card-title" for="speed">Speed <small>({{ values.siren.speed }})</small></label>
                        <input id="speed" class="form-range" v-model.number="values.siren.speed" max="12" min="0.1" step="0.1" type="range">
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-4">
                    <div class="card bg-secondary-custom text-white h-100">
                      <div class="card-body">
                        <label class="h5 card-title" for="depth">Depth <small>({{ values.siren.depth }})</small></label>
                        <input id="depth" class="form-range" v-model.number="values.siren.depth" max="600" min="0" step="10" type="range">
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>

          <!-- Presets -->
          <div class="col-12 col-lg-4">
            <div class="card text-bg-dark mb-3">
              <div class="card-header">
                Presets
              </div>
              <div class="card-body">
                <p>
                  <button type="button" v-for="p in presets" :key="p.name" :class="['btn m-1', selectedPreset === p.name ? 'btn-info' : 'btn-secondary']" @click="applyPreset(p)">{{ p.name }}</button>
                </p>
                <p><button type="button" class="btn btn-light w-100" @click="applyRandomPreset">Random</button></p>
                <small class="text-white-50">Keys <b>1</b> to <b>5</b> select a preset.</small>
              </div>
            </div>
          </div>

          <!-- Delay -->
          <div class="col-12 col-lg-6">
            <div class="card text-bg-dark mb-3">
              <div class="card-header">
                Delay
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-12 mb-3">
                    <div class="card text-white bg-secondary-custom">
                      <div class="card-body d-flex justify-content-center">
                        <div class="form-check form-switch">
                          <input type="checkbox" role="switch" v-model="values.isDelayEnabled" class="form-check-input" id="delay-enabled">
                          <label class="form-check-label" for="delay-enabled">On/Off</label>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="card text-white bg-secondary-custom mb-3">
                      <div class="card-body">
                        <label class="form-label" for="delay-time">Time <small>({{ values.delay.time }})</small></label>
                        <input id="delay-time" class="form-range" v-model.number="values.delay.time" max="1700" min="1" step="1" type="range">
                      </div>
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="card text-white bg-secondary-custom mb-3">
                      <div class="card-body">
                        <label class="form-label" for="delay-feedback">Feedback <small>({{ values.delay.feedback }})</small></label>
                        <input id="delay-feedback" class="form-range" v-model.number="values.delay.feedback" max="1" min="0" step="0.05" type="range">
                      </div>
                    </div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="card text-white bg-secondary-custom mb-3">
                      <div class="card-body">
                        <label class="form-label" for="delay-mix">Mix <small>({{ values.delay.mix }})</small></label>
                        <input id="delay-mix" class="form-range" v-model.number="values.delay.mix" max="1" min="0" step="0.05" type="range">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Output -->
          <div class="col-12 col-lg-6">
            <div class="card text-bg-dark mb-3">
              <div class="card-header">
                Output
              </div>
              <div class="card-body">
                <label class="form-label" for="volume">Volume <small>({{ values.volume }})</small></label>
                <input id="volume" class="form-range mb-3" v-model.number="values.volume" max="1" min="0" step="0.05" type="range">

                <div class="progress" style="height: 30px;" role="meter" aria-label="Output level" :aria-valuenow="meterValue" aria-valuemin="0" aria-valuemax="100">
                  <div :class="['progress-bar', isClipping ? 'bg-danger' : 'bg-success']" :style="{ width: meterValue + '%' }"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 text-center trigger-bar sticky-bottom py-2 mb-2">
            <button type="button" :class="['btn btn-info btn-lg w-100 trigger', { active: isPlaying }]"
              @pointerdown.prevent="onPointerDown" @pointerup="stop" @pointerleave="stop" @pointercancel="stop" @contextmenu.prevent>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2v12l11-6z"/></svg>
              Trigger
            </button>
            <small>Or press the <b>space</b> bar.</small>
          </div>
        </div>
      </div>
    </div>

    <script src="vendor/tuna.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
